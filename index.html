<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prima Dopo Slider</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111214;
      --panel: #191b1f;
      --line: #2d3138;
      --text: #f4f5f7;
      --muted: #9da3ad;
      --accent: #e94b5b;
      --blue: #7cc7ff;
      --focus: #f6d365;
      --side-width: 138px;
      --viewport-offset: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 94%, black);
      overflow: hidden;
    }

    .file-input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .record-controls {
      width: min(100%, 540px);
      min-width: 0;
      display: grid;
      grid-template-columns: 76px 90px minmax(150px, 240px) 78px;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .button,
    .name-input,
    .number-input,
    .format-select {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #20232a;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .name-input,
    .number-input,
    .format-select {
      height: 36px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      min-width: 78px;
      flex: 0 0 auto;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }

    .button:hover {
      border-color: #515864;
      background: #262a32;
    }

    .button:active {
      transform: translateY(1px);
    }

    .button:focus-visible,
    .name-input:focus-visible,
    .number-input:focus-visible,
    .format-select:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(246, 211, 101, 0.18);
    }

    .button[aria-disabled="true"],
    .button:disabled,
    .name-input:disabled,
    .number-input:disabled,
    .format-select:disabled,
    .file-input:disabled + .button {
      color: #777d88;
      cursor: not-allowed;
      pointer-events: none;
      transform: none;
    }

    .name-input {
      width: 100%;
      min-width: 0;
      padding: 0 12px;
    }

    .toolbar-field {
      min-width: 0;
      display: block;
    }

    .duration-control {
      position: relative;
      height: 36px;
      display: block;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #20232a;
    }

    .duration-control .duration-input {
      width: 100%;
      height: 100%;
      padding: 0 0 0 8px;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: right;
    }

    .duration-control .duration-input::-webkit-inner-spin-button,
    .percent-control .number-input::-webkit-inner-spin-button {
      margin-left: 20px;
    }

    .duration-control .duration-input:focus-visible {
      border-color: transparent;
      box-shadow: none;
    }

    .duration-control:focus-within {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(246, 211, 101, 0.18);
    }

    .duration-suffix {
      position: absolute;
      top: 50%;
      right: 20px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .record-field {
      min-width: 0;
    }

    #recordButton {
      width: 100%;
      min-width: 0;
      height: 36px;
    }

    .duration-input {
      width: 100%;
      padding: 0 8px;
    }

    .format-select {
      width: 100%;
      padding: 0 8px;
      cursor: pointer;
    }

    .number-input {
      width: 100%;
      padding: 0 9px;
      font-variant-numeric: tabular-nums;
    }

    .rec-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(233, 75, 91, 0.16);
    }

    .recording .rec-dot {
      animation: pulse 700ms ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from {
        transform: scale(0.75);
        opacity: 0.55;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    main {
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 10px;
    }

    .workspace {
      position: relative;
      width: min(calc(100vw - 20px), calc(100vh - var(--viewport-offset)));
      height: min(calc(100vw - 20px), calc(100vh - var(--viewport-offset)));
      min-width: 0;
      min-height: 0;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255,255,255,0.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.035) 75%),
        #0b0c0f;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas.is-dragging {
      cursor: grabbing;
    }

    canvas.is-sliding {
      cursor: ew-resize;
    }

    .upload-guides {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      pointer-events: none;
    }

    .upload-guide {
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(8, 9, 11, 0.18);
      transition: opacity 140ms ease;
    }

    .upload-guide:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .upload-guide span {
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      background: rgba(17, 18, 20, 0.78);
      font-size: 13px;
    }

    .stage.has-before .before-guide,
    .stage.has-after .after-guide {
      opacity: 0;
    }

    .stage:not(.has-before):not(.has-after) canvas {
      cursor: pointer;
    }

    .view-panel {
      position: absolute;
      top: 50%;
      left: calc(100% + 14px);
      width: var(--side-width);
      display: grid;
      gap: 8px;
      transform: translateY(-50%);
    }

    .view-field {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .view-label {
      padding-left: 0;
    }

    .percent-control {
      position: relative;
      height: 36px;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
    }

    .percent-control .number-input {
      width: 100%;
      height: 36px;
      padding: 0;
      text-align: right;
    }

    .percent-control .number-input:focus-visible {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(246, 211, 101, 0.18);
    }

    .percent-sign {
      position: absolute;
      top: 50%;
      right: 20px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .reset-button {
      width: max-content;
      min-width: 0;
      height: 30px;
      margin-top: 1px;
      padding: 0 5px;
      border-color: transparent;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      justify-self: start;
    }

    .reset-button:hover {
      border-color: transparent;
      background: #1c1f24;
      color: var(--text);
    }

    .reset-button:active {
      transform: none;
    }

    .reset-icon {
      font-size: 17px;
      line-height: 1;
    }

    @media (max-width: 1000px) and (min-width: 681px) {
      .workspace {
        width: min(calc(100vw - 324px), calc(100vh - var(--viewport-offset)));
        height: min(calc(100vw - 324px), calc(100vh - var(--viewport-offset)));
      }
    }

    @media (max-width: 680px) {
      .workspace {
        width: min(calc(100vw - 20px), calc(100vh - var(--viewport-offset) - 74px));
        height: min(calc(100vw - 20px), calc(100vh - var(--viewport-offset) - 74px));
      }

      .view-panel {
        top: calc(100% + 10px);
        left: 50%;
        width: 100%;
        grid-template-columns: repeat(3, minmax(0, 1fr)) auto;
        align-items: end;
        transform: translateX(-50%);
      }

      .view-field {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .reset-button {
        align-self: end;
        justify-self: end;
      }
    }

    @media (max-width: 560px) {
      :root {
        --side-width: 100px;
        --viewport-offset: 68px;
      }

      .toolbar {
        min-height: 48px;
        padding: 6px;
      }

      .record-controls {
        grid-template-columns: 60px 68px minmax(80px, 1fr) 62px;
        gap: 6px;
      }

      .duration-input {
        padding-inline: 0;
      }

      .duration-control {
        padding-inline: 0;
      }

      .duration-control .duration-input {
        width: 100%;
        padding-right: 32px;
      }

      .name-input,
      .format-select {
        padding-inline: 8px;
      }

      #recordButton {
        gap: 5px;
        padding-inline: 7px;
      }
    }

    @media (max-width: 380px) {
      :root {
        --side-width: 94px;
      }

      .toolbar {
        padding-inline: 5px;
      }

      .record-controls {
        grid-template-columns: 58px 62px minmax(70px, 1fr) 58px;
        gap: 5px;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <div class="record-controls">
      <label class="toolbar-field" title="Durata registrazione">
        <span class="duration-control">
          <input class="number-input duration-input" id="durationSeconds" type="number" min="0.5" max="120" step="0.5" value="4" aria-label="Durata registrazione in secondi">
          <span class="duration-suffix" aria-hidden="true">s</span>
        </span>
      </label>

      <label class="toolbar-field">
        <select class="format-select" id="videoFormat" aria-label="Formato video" title="Formato video">
          <option value="mp4" selected>MP4</option>
          <option value="webm">WebM</option>
        </select>
      </label>

      <label class="toolbar-field">
        <input class="name-input" id="fileName" value="prima-dopo" aria-label="Nome video" title="Nome video">
      </label>

      <div class="toolbar-field record-field">
        <button class="button" id="recordButton" type="button" disabled title="Registra">
          <span class="rec-dot" aria-hidden="true"></span>
          REC
        </button>
      </div>
    </div>
  </div>

  <main>
    <div class="workspace">
      <div class="stage" id="stage">
        <input class="file-input" id="beforeInput" type="file" accept="image/*">
        <input class="file-input" id="afterInput" type="file" accept="image/*">
        <canvas id="viewer" aria-label="Prima dopo" title="Clic sinistra: Prima. Clic destra: Dopo. Trascina per spostare."></canvas>
        <div class="upload-guides" aria-hidden="true">
          <div class="upload-guide before-guide"><span>Prima</span></div>
          <div class="upload-guide after-guide"><span>Dopo</span></div>
        </div>
      </div>

      <aside class="view-panel" aria-label="Navigazione immagine">
        <label class="view-field">
          <span class="view-label">X</span>
          <input class="number-input" id="viewX" type="number" step="0.1" value="0" aria-label="Asse X">
        </label>
        <label class="view-field">
          <span class="view-label">Y</span>
          <input class="number-input" id="viewY" type="number" step="0.1" value="0" aria-label="Asse Y">
        </label>
        <label class="view-field">
          <span class="view-label">Zoom</span>
          <span class="percent-control">
            <input class="number-input" id="viewZoom" type="number" min="5" max="51200" step="1" value="100" aria-label="Zoom percentuale">
            <span class="percent-sign" aria-hidden="true">%</span>
          </span>
        </label>
        <button class="button reset-button" id="resetViewButton" type="button" title="Ripristina vista">
          <span class="reset-icon" aria-hidden="true">&#8634;</span>
          Reset
        </button>
      </aside>
    </div>
  </main>

  <script>
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("viewer");
    const ctx = canvas.getContext("2d", { alpha: false });
    const beforeInput = document.getElementById("beforeInput");
    const afterInput = document.getElementById("afterInput");
    const recordButton = document.getElementById("recordButton");
    const fileNameInput = document.getElementById("fileName");
    const durationInput = document.getElementById("durationSeconds");
    const formatSelect = document.getElementById("videoFormat");
    const viewXInput = document.getElementById("viewX");
    const viewYInput = document.getElementById("viewY");
    const viewZoomInput = document.getElementById("viewZoom");
    const resetViewButton = document.getElementById("resetViewButton");
    const viewInputs = [viewXInput, viewYInput, viewZoomInput];
    const toolbar = document.getElementById("toolbar");
    const EXPORT_SIZE = 1080;

    const state = {
      before: null,
      after: null,
      slider: 0.5,
      zoom: 1,
      panX: 0,
      panY: 0,
      cssSize: 0,
      dpr: 1,
      pointerMode: null,
      pointerId: null,
      lastX: 0,
      lastY: 0,
      pointerStartX: 0,
      pointerStartY: 0,
      pointerMoved: false,
      recording: false,
      raf: 0,
      renderRaf: 0,
      syncInputsOnRender: false,
      cancelRecordingAnimation: null
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function parseNumber(value, fallback) {
      const parsed = Number.parseFloat(String(value).replace(",", "."));
      return Number.isFinite(parsed) ? parsed : fallback;
    }

    function formatNumber(value, digits) {
      return Number(value.toFixed(digits)).toString();
    }

    function isReady() {
      return Boolean(state.before && state.after);
    }

    function sanitizeFileName(value, extension) {
      const trimmed = value.trim().replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, "-");
      const safe = trimmed || "prima-dopo";
      const base = safe.replace(/\.(webm|mp4)$/i, "");
      return `${base}.${extension}`;
    }

    function setReadyState() {
      const ready = isReady();
      recordButton.disabled = !ready || state.recording;
      beforeInput.disabled = state.recording;
      afterInput.disabled = state.recording;
      fileNameInput.disabled = state.recording;
      durationInput.disabled = state.recording;
      formatSelect.disabled = state.recording;
      resetViewButton.disabled = state.recording;
      viewInputs.forEach((input) => {
        input.disabled = state.recording;
      });
      stage.classList.toggle("has-before", Boolean(state.before));
      stage.classList.toggle("has-after", Boolean(state.after));
    }

    function getDurationMs() {
      const seconds = clamp(parseNumber(durationInput.value, 4), 0.5, 120);
      durationInput.value = formatNumber(seconds, 1);
      return seconds * 1000;
    }

    function updateViewInputs() {
      if (document.activeElement !== viewXInput) {
        viewXInput.value = formatNumber(state.panX, 2);
      }

      if (document.activeElement !== viewYInput) {
        viewYInput.value = formatNumber(state.panY, 2);
      }

      if (document.activeElement !== viewZoomInput) {
        viewZoomInput.value = formatNumber(state.zoom * 100, 2);
      }
    }

    function applyViewInputs() {
      state.panX = parseNumber(viewXInput.value, state.panX);
      state.panY = parseNumber(viewYInput.value, state.panY);
      const zoomPercent = parseNumber(viewZoomInput.value, state.zoom * 100);
      state.zoom = clamp(zoomPercent / 100, 0.05, 512);
      updateViewInputs();
      draw();
    }

    function resetNavigation() {
      state.zoom = 1;
      state.panX = 0;
      state.panY = 0;
      updateViewInputs();
      draw();
    }

    function scheduleDraw(syncInputs = false) {
      state.syncInputsOnRender ||= syncInputs;

      if (state.renderRaf) {
        return;
      }

      state.renderRaf = requestAnimationFrame(() => {
        state.renderRaf = 0;

        if (state.syncInputsOnRender) {
          updateViewInputs();
          state.syncInputsOnRender = false;
        }

        draw();
      });
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const url = URL.createObjectURL(file);

        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Immagine non valida"));
        };

        image.src = url;
      });
    }

    function drawImage(image, targetCtx, size, panScale) {
      if (!image) {
        return;
      }

      const baseScale = Math.min(size / image.naturalWidth, size / image.naturalHeight);
      const width = image.naturalWidth * baseScale * state.zoom;
      const height = image.naturalHeight * baseScale * state.zoom;
      const x = (size - width) / 2 + state.panX * panScale;
      const y = (size - height) / 2 + state.panY * panScale;

      targetCtx.drawImage(image, x, y, width, height);
    }

    function drawDivider(targetCtx, x, size, markerScale) {
      const handleWidth = 30 * markerScale;
      const handleHeight = 44 * markerScale;
      const handleRadius = 15 * markerScale;
      const chevronWidth = 5 * markerScale;
      const chevronHeight = 10 * markerScale;
      const chevronGap = 3 * markerScale;

      targetCtx.save();
      targetCtx.strokeStyle = "rgba(255,255,255,0.95)";
      targetCtx.lineWidth = Math.max(2, 2 * markerScale);
      targetCtx.shadowColor = "rgba(0,0,0,0.75)";
      targetCtx.shadowBlur = 7 * markerScale;
      targetCtx.beginPath();
      targetCtx.moveTo(x, 0);
      targetCtx.lineTo(x, size);
      targetCtx.stroke();

      targetCtx.fillStyle = "#f7f8fb";
      targetCtx.shadowBlur = 12 * markerScale;
      targetCtx.beginPath();
      targetCtx.roundRect(
        x - handleWidth / 2,
        size / 2 - handleHeight / 2,
        handleWidth,
        handleHeight,
        handleRadius
      );
      targetCtx.fill();

      targetCtx.shadowBlur = 0;
      targetCtx.strokeStyle = "#111214";
      targetCtx.lineWidth = Math.max(1.5, 1.8 * markerScale);
      targetCtx.lineCap = "round";
      targetCtx.lineJoin = "round";
      targetCtx.beginPath();
      targetCtx.moveTo(x - chevronGap, size / 2 - chevronHeight / 2);
      targetCtx.lineTo(x - chevronGap - chevronWidth, size / 2);
      targetCtx.lineTo(x - chevronGap, size / 2 + chevronHeight / 2);
      targetCtx.moveTo(x + chevronGap, size / 2 - chevronHeight / 2);
      targetCtx.lineTo(x + chevronGap + chevronWidth, size / 2);
      targetCtx.lineTo(x + chevronGap, size / 2 + chevronHeight / 2);
      targetCtx.stroke();
      targetCtx.restore();
    }

    function drawScene(targetCtx, size, panScale, markerScale) {
      targetCtx.clearRect(0, 0, size, size);
      targetCtx.fillStyle = "#0b0c0f";
      targetCtx.fillRect(0, 0, size, size);

      const sliderX = state.slider * size;

      if (state.before) {
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.rect(0, 0, sliderX, size);
        targetCtx.clip();
        drawImage(state.before, targetCtx, size, panScale);
        targetCtx.restore();
      }

      if (state.after) {
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.rect(sliderX, 0, size - sliderX, size);
        targetCtx.clip();
        drawImage(state.after, targetCtx, size, panScale);
        targetCtx.restore();
      }

      if (isReady()) {
        drawDivider(targetCtx, state.slider * size, size, markerScale);
      }
    }

    function draw() {
      if (!state.cssSize) {
        return;
      }

      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      drawScene(ctx, state.cssSize, 1, 1);
    }

    function drawRecordingFrame(targetCtx) {
      if (!state.cssSize) {
        return;
      }

      const scale = EXPORT_SIZE / state.cssSize;
      targetCtx.setTransform(1, 0, 0, 1, 0, 0);
      drawScene(targetCtx, EXPORT_SIZE, scale, scale);
    }

    function resizeCanvas() {
      const rect = stage.getBoundingClientRect();
      const size = Math.max(1, Math.floor(rect.width));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      state.cssSize = size;
      state.dpr = dpr;
      canvas.width = Math.round(size * dpr);
      canvas.height = Math.round(size * dpr);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      draw();
    }

    function canvasPoint(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: clamp(event.clientX - rect.left, 0, state.cssSize),
        y: clamp(event.clientY - rect.top, 0, state.cssSize)
      };
    }

    function updateCursor(event) {
      if (!isReady() || state.recording) {
        canvas.classList.remove("is-sliding");
        return;
      }

      const point = canvasPoint(event);
      const sliderX = state.slider * state.cssSize;
      canvas.classList.toggle("is-sliding", Math.abs(point.x - sliderX) <= 18);
    }

    async function handleImageInput(event, slot) {
      const file = event.target.files?.[0];
      if (!file) {
        return;
      }

      try {
        state[slot] = await loadImage(file);
        resetNavigation();
        setReadyState();
        draw();
      } catch (error) {
        alert(error.message);
      } finally {
        event.target.value = "";
      }
    }

    function handleWheel(event) {
      if (state.recording || (!state.before && !state.after)) {
        return;
      }

      event.preventDefault();

      const point = canvasPoint(event);
      const oldZoom = state.zoom;
      const zoomFactor = Math.exp(-event.deltaY * 0.0015);
      const nextZoom = clamp(oldZoom * zoomFactor, 0.05, 512);

      const center = state.cssSize / 2;
      const localX = point.x - center - state.panX;
      const localY = point.y - center - state.panY;
      const scale = nextZoom / oldZoom;

      state.panX = point.x - center - localX * scale;
      state.panY = point.y - center - localY * scale;
      state.zoom = nextZoom;
      scheduleDraw(true);
    }

    function handlePointerDown(event) {
      if (state.recording) {
        return;
      }

      const point = canvasPoint(event);
      const sliderX = state.slider * state.cssSize;

      state.pointerId = event.pointerId;
      state.lastX = point.x;
      state.lastY = point.y;
      state.pointerStartX = point.x;
      state.pointerStartY = point.y;
      state.pointerMoved = false;
      state.pointerMode = isReady() && Math.abs(point.x - sliderX) <= 22 ? "slider" : "pan";
      canvas.setPointerCapture(event.pointerId);
      canvas.classList.add(state.pointerMode === "pan" ? "is-dragging" : "is-sliding");

      if (state.pointerMode === "slider") {
        state.slider = clamp(point.x / state.cssSize, 0, 1);
        scheduleDraw();
      }
    }

    function handlePointerMove(event) {
      if (state.recording) {
        return;
      }

      if (state.pointerMode && state.pointerId === event.pointerId) {
        const point = canvasPoint(event);
        const distance = Math.hypot(
          point.x - state.pointerStartX,
          point.y - state.pointerStartY
        );

        if (distance > 5) {
          state.pointerMoved = true;
        }

        if (state.pointerMode === "slider") {
          state.slider = clamp(point.x / state.cssSize, 0, 1);
        } else if (state.before || state.after) {
          state.panX += point.x - state.lastX;
          state.panY += point.y - state.lastY;
          state.lastX = point.x;
          state.lastY = point.y;
        }

        scheduleDraw(state.pointerMode === "pan");
        return;
      }

      updateCursor(event);
    }

    function handlePointerUp(event) {
      if (state.pointerId !== event.pointerId) {
        return;
      }

      const point = canvasPoint(event);
      const shouldOpenImage = state.pointerMode === "pan" && !state.pointerMoved;

      state.pointerMode = null;
      state.pointerId = null;
      canvas.classList.remove("is-dragging", "is-sliding");

      if (shouldOpenImage) {
        const sliderX = state.slider * state.cssSize;
        const input = point.x < sliderX ? beforeInput : afterInput;
        input.click();
      }
    }

    function selectRecorderSettings(format) {
      const typesByFormat = {
        mp4: [
          "video/mp4;codecs=avc1.42E01E",
          "video/mp4;codecs=avc1.42001E",
          "video/mp4;codecs=avc1.640028",
          "video/mp4;codecs=avc1",
          "video/mp4;codecs=h264",
          "video/mp4"
        ],
        webm: [
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm"
        ]
      };

      const mimeType = typesByFormat[format].find((type) => MediaRecorder.isTypeSupported(type));
      return mimeType ? { extension: format, mimeType } : null;
    }

    function downloadBlob(blob, extension, requestedName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = sanitizeFileName(requestedName, extension);
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function animateRecording(duration, targetCtx) {
      return new Promise((resolve) => {
        const half = duration / 2;
        const start = performance.now();
        let finishTimeout = 0;

        function finish() {
          state.cancelRecordingAnimation = null;
          resolve();
        }

        function frame(now) {
          const elapsed = clamp(now - start, 0, duration);

          if (elapsed <= half) {
            state.slider = elapsed / half;
          } else {
            state.slider = 1 - (elapsed - half) / half;
          }

          draw();
          drawRecordingFrame(targetCtx);

          if (elapsed < duration) {
            state.raf = requestAnimationFrame(frame);
          } else {
            state.slider = 0;
            draw();
            drawRecordingFrame(targetCtx);
            finishTimeout = setTimeout(finish, 120);
          }
        }

        state.cancelRecordingAnimation = () => {
          cancelAnimationFrame(state.raf);
          clearTimeout(finishTimeout);
          finish();
        };

        state.slider = 0;
        draw();
        drawRecordingFrame(targetCtx);
        state.raf = requestAnimationFrame(frame);
      });
    }

    async function record() {
      if (!isReady() || state.recording) {
        return;
      }

      if (typeof MediaRecorder === "undefined") {
        alert("Registrazione non supportata da questo browser");
        return;
      }

      const format = formatSelect.value;
      const recorderSettings = selectRecorderSettings(format);
      if (!recorderSettings) {
        alert(`${format.toUpperCase()} non supportato da questo browser. Seleziona un altro formato.`);
        return;
      }

      const recordingCanvas = document.createElement("canvas");
      recordingCanvas.width = EXPORT_SIZE;
      recordingCanvas.height = EXPORT_SIZE;

      if (!recordingCanvas.captureStream) {
        alert("Registrazione non supportata da questo browser");
        return;
      }

      const recordingCtx = recordingCanvas.getContext("2d", { alpha: false });
      const previousSlider = state.slider;
      const requestedName = fileNameInput.value;
      const chunks = [];
      let recorderFailed = false;
      let cleanupDone = false;
      let recorder;

      recordingCtx.imageSmoothingEnabled = true;
      recordingCtx.imageSmoothingQuality = "high";
      drawRecordingFrame(recordingCtx);

      const stream = recordingCanvas.captureStream(60);

      try {
        recorder = new MediaRecorder(stream, {
          mimeType: recorderSettings.mimeType,
          videoBitsPerSecond: 12000000
        });
      } catch (error) {
        stream.getTracks().forEach((track) => track.stop());
        alert("Impossibile avviare la registrazione con il formato selezionato");
        return;
      }

      state.recording = true;
      toolbar.classList.add("recording");
      setReadyState();

      function restoreRecordingState() {
        if (cleanupDone) {
          return;
        }

        cleanupDone = true;
        stream.getTracks().forEach((track) => track.stop());
        state.recording = false;
        state.slider = previousSlider;
        toolbar.classList.remove("recording");
        setReadyState();
        draw();
      }

      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size) {
          chunks.push(event.data);
        }
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: recorder.mimeType || recorderSettings.mimeType });

        if (!recorderFailed && blob.size) {
          downloadBlob(blob, recorderSettings.extension, requestedName);
        } else if (!recorderFailed) {
          alert("La registrazione non ha prodotto dati video");
        }

        restoreRecordingState();
      };

      recorder.onerror = () => {
        recorderFailed = true;
        state.cancelRecordingAnimation?.();
        alert("Errore durante la registrazione video");
      };

      try {
        recorder.start();
        await animateRecording(getDurationMs(), recordingCtx);

        if (recorder.state !== "inactive") {
          recorder.stop();
        }
      } catch (error) {
        recorderFailed = true;
        state.cancelRecordingAnimation?.();

        if (recorder.state !== "inactive") {
          recorder.stop();
        } else {
          restoreRecordingState();
        }

        alert("Impossibile completare la registrazione video");
      }
    }

    beforeInput.addEventListener("change", (event) => handleImageInput(event, "before"));
    afterInput.addEventListener("change", (event) => handleImageInput(event, "after"));
    recordButton.addEventListener("click", record);
    durationInput.addEventListener("change", getDurationMs);
    resetViewButton.addEventListener("click", resetNavigation);
    viewInputs.forEach((input) => {
      input.addEventListener("change", applyViewInputs);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          input.blur();
        }
      });
    });
    canvas.addEventListener("wheel", handleWheel, { passive: false });
    canvas.addEventListener("pointerdown", handlePointerDown);
    canvas.addEventListener("pointermove", handlePointerMove);
    canvas.addEventListener("pointerup", handlePointerUp);
    canvas.addEventListener("pointercancel", handlePointerUp);
    canvas.addEventListener("mouseleave", () => {
      if (!state.pointerMode) {
        canvas.classList.remove("is-sliding");
      }
    });

    new ResizeObserver(resizeCanvas).observe(stage);
    setReadyState();
    updateViewInputs();
    resizeCanvas();
  </script>
</body>
</html>
